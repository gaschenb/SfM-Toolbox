[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfmtoolbox"
version = "1.1.0"
description = "Incremental Structure-from-Motion from scratch, with a COLMAP-style PyQt GUI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-contrib-python-headless>=4.7",
    "matplotlib>=3.7",
    "Pillow>=9.0",
    "torch>=2.0",
    "kornia>=0.7",
    "lightglue @ git+https://github.com/cvg/LightGlue",
]

[project.urls]
Homepage = "https://github.com/gaschenb/SfM-Toolbox"
Repository = "https://github.com/gaschenb/SfM-Toolbox"

[project.optional-dependencies]
gui = ["PyQt5>=5.15", "pyqtgraph>=0.13.2", "PyOpenGL>=3.1"]

[project.scripts]
sfm-toolbox = "sfmtoolbox.cli:main"
sfm-toolbox-gui = "sfmtoolbox.gui.app:main"

[tool.setuptools.packages.find]
include = ["sfmtoolbox*"]
